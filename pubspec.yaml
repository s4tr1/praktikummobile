name: conatus_academy
description: English learning app with quiz and translation features.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # HTTP Requests
  http: ^1.1.0
  
  # JSON Serialization
  json_serializable: ^6.7.1
  dio: ^5.9.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/quizzes.json