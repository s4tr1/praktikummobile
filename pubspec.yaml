name: conatus_academy
description: English learning app with quiz and translation features.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # -----------------------
  # STATE MANAGEMENT
  # -----------------------
  get: ^4.6.6

  # -----------------------
  # BACKEND & DATABASE
  # -----------------------
  supabase_flutter: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  sqflite: ^2.3.0
  path: ^1.8.3

  # -----------------------
  # NETWORK & JSON
  # -----------------------
  http: ^1.1.0
  dio: ^5.9.0
  json_serializable: ^6.7.1

  # -----------------------
  # UTILITIES
  # -----------------------
  crypto: ^3.0.3

  # -----------------------
  # LOCATION-AWARE
  # -----------------------
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.2

  # -----------------------
  # 🔔 NOTIFICATIONS (NEW)
  # -----------------------
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.2
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/quizzes.json
    - assets/sounds/  # Untuk custom notification sounds
    - assets/data/vocabulary_words.json  # ✅ ATAU INI